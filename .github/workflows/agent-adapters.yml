name: Agent adapter pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/agent-adapters.py
      - .github/workflows/agent-adapters.yml
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        adapter: [smolagents, langchain, gpt-researcher]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smolagents and its compatible MCP SDK
        if: matrix.adapter == 'smolagents'
        run: python -m pip install 'smolagents[mcp]' 'mcp>=1.15,<2'
      - name: Install the LangChain adapter
        if: matrix.adapter == 'langchain'
        run: python -m pip install langchain-mcp-adapters
      - name: Install GPT Researcher with its MCP adapter
        if: matrix.adapter == 'gpt-researcher'
        run: python -m pip install gpt-researcher langchain-mcp-adapters
      - name: Discover the tool and retrieve a DOI
        run: python examples/agent-adapters.py ${{ matrix.adapter }} --qa
