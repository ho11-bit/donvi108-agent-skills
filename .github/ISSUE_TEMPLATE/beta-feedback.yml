name: Beta integration feedback
description: Report an integration problem or a concrete improvement.
title: "[beta] "
body:
  - type: markdown
    attributes:
      value: "This issue is public. Never post tokens, private queries or confidential content. For result-specific private feedback, use submit_beta_feedback instead."
  - type: input
    id: client
    attributes:
      label: Client and version
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
      description: Include a non-sensitive example and error code, if available.
    validations:
      required: true
